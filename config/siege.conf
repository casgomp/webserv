http {
    include mime.types;
    root content/website;
    client_max_body_size 1000000;

    server {
        listen localhost:8080;
        server_name localhost;

        location / {
            allowed_methods GET;
            index index.html;
        }

        location /files/ {
            root content;
            allowed_methods GET;
            autoindex on;
        }
    }
}
