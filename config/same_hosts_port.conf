http {
    include mime.types;
    root content;

 	server {
        listen localhost:8080;
        server_name same.test;
        root content/files;

        location / {
            allowed_methods GET;
            autoindex on;
        }
    }

    server {
        listen localhost:8080;
        server_name same.test;
        root content/website;

        location / {
            allowed_methods GET;
            index index.html;
        }
    }

}
