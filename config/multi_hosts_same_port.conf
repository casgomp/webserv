http {
    include mime.types;
    root content;

    server {
        listen localhost:8080;
        server_name site.test;
        root content/website;

        location / {
            allowed_methods GET;
            index index.html;
        }
    }

    server {
        listen localhost:8080;
        server_name files.test;
        root content/files;

        location / {
            allowed_methods GET;
            autoindex on;
        }
    }

    server {
        listen localhost:8080;
        server_name uploads.test;
        root content/uploads;

        location / {
            allowed_methods GET;
            index upload.html;
        }
    }
}
