http {

    include mime.types;
	root src;

     server {
        # listen 8080;
		listen localhost:8080;
		listen localhost:5143;
		# listen ;
        root content;
		client_max_body_size 1000;
		server_name www.hello.com hello.com www.hello hello;

		error_page 404 /404.html;
		error_page 500 502 503 /50x.html;

		location / {
			root /;
		}

		location /content {
			root /;
		}

		location /404.html {
			root content;
		}

		location /fruits {
			return 301 /content/files/index.html;
		}

		location /fruits/noslash {
			return 301 noslash;
		}

		location /fruits/fruits {
			return 301 /content/files/index.html;
		}

        location /files {
            root content;
			allowed_methods GET POST DELETE;
        }

        location /uploads {
            root content;
			allowed_methods POST;
        }
    }
}