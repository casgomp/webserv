http {
    include mime.types;
    root content;

    server {
        listen localhost:8080;
        client_max_body_size 10000000;

        location / {
            allowed_methods GET;
            index index.html;
        }

        location /website/ {
            allowed_methods GET;
            index index.html;
        }

        location /uploads/ {
            allowed_methods GET POST DELETE;
        }
    }
}
