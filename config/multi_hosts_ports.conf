http {
    include mime.types;
    root content;

    server {
        listen localhost:8081;
        server_name alpha.test;
        root content/website;

        location / {
            allowed_methods GET;
            index index.html;
        }
    }

    server {
        listen localhost:8082;
        server_name beta.test;
        root content/files;

        location / {
            allowed_methods GET;
            autoindex on;
        }
    }

    server {
        listen localhost:8083;
        server_name gamma.test;
        root content/uploads;

        location / {
            allowed_methods GET;
            index upload.html;
        }
    }
}
