http {

    include mime.types;
	root testers;

     server {
		listen localhost:8080;
		client_max_body_size 1000;
		allowed_methods GET DELETE;

		location / {
			allowed_methods GET;
			autoindex on;
		}

		location /post_body {
			allowed_methods POST;
			client_max_body_size 100;
		}

		location /directory/ {
			allowed_methods GET POST;
			index youpi.bad_extension;
			client_max_body_size 100000000;
		}
    }
}