http {

	root content;
	#root someerrorpath/that/leads/to/nowhere;
    include mime.types;
	#wrong directive mime.types;
	client_max_body_size 1000;
	#client_max_body_size 1000a;
	autoindex on;
	#autoindex not_0_or_1;

    server {
        listen 8080;
        root /Users/laithharb/Desktop/mysite;

		error_page 404 /404.html;
		location /404.html {
			404.html;
		}

        location /fruits {
            root /Users/laithharb/Desktop/mysite;
        }

        location /carbs {
            root /Users/laithharb/Desktop/mysite;
        }
    }

    events {}
}