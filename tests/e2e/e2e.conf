http {
    include mime.types;
    root www;

    server {
        listen localhost:18080;
        server_name main.test;
        client_max_body_size 1000;
        allowed_methods GET;
        location / {
            allowed_methods GET;
        }
        location /tiny/ {
            allowed_methods POST;
            client_max_body_size 10;
        }
        location /upload/ {
            allowed_methods GET POST DELETE;
        }
        location /upload/ro/ {
            allowed_methods GET;
        }
        location /all/ {
            allowed_methods GET POST DELETE;
        }
        location /fruits {
            allowed_methods POST;
        }
        location /moved/ {
            allowed_methods GET;
            return 301 /dir/;
        }
        location /gone {
            allowed_methods GET;
            return 308 /index.html;
        }
        location /auto/ {
            allowed_methods GET;
            autoindex on;
        }
        location /noauto/ {
            allowed_methods GET;
            autoindex off;
        }
        location /idx/ {
            allowed_methods GET;
            index missing.html hello.txt;
        }
        location /cgi/ {
            allowed_methods GET POST;
            client_max_body_size 1000000;
            cgi_extension .py /usr/bin/python3;
        }
    }
    server {
        listen localhost:18080;
        server_name other.test;
        root www2;
        allowed_methods GET;
        location / {
            allowed_methods GET;
        }
    }

    server {
        listen 18082;
        allowed_methods GET;
        location / {
            allowed_methods GET;
        }
    }
    server {
        listen 127.0.0.1:18083;
        allowed_methods GET;
        location / {
            allowed_methods GET;
        }
    }
    server {
        listen *:18084;
        allowed_methods GET;
        location / {
            allowed_methods GET;
        }
    }

    server {
        listen localhost:18086;
        allowed_methods GET;
        location /docs/ {
            allowed_methods GET;
        }
    }
}
