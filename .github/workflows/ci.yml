name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up C++ environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build the project
        run: make

      - name: Run tests
        run: make test